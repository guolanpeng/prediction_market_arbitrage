[project]
name = "prediction-market-arbitrage"
version = "0.1.0"
description = "Prediction market scanning, paired trading, and account reconciliation"
requires-python = ">=3.13,<3.15"
dependencies = [
    "httpx==0.28.1",
    "redis==8.1.0",
    "synpath==0.5.1",
    "predict-sdk==0.0.22",
    "websockets==15.0.1",
    "eth-account==0.14.0",
    "eth-abi==6.0.0",
    "eth-utils==6.0.0",
]

[dependency-groups]
test = ["pytest==9.1.1"]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
